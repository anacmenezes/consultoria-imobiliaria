services:

  api:
    build: .
    container_name: consultoria-imobiliaria-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://agency_user:agency_password@db:5432/agency_analysis
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: consultoria-imobiliaria-db
    environment:
      POSTGRES_USER: agency_user
      POSTGRES_PASSWORD: agency_password
      POSTGRES_DB: agency_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_user -d agency_analysis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: